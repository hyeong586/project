<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 작성 - Culture Archive</title>

    <link rel="stylesheet" href="css/write.css">
</head>

<body>

    <!-- 1. 상단 제목 영역 -->
    <header id="main-header">
        <h1>✏️ Culture Archive</h1>
        <p>좋아하는 작품과 그에 대한 나의 감상을 기록하는 공간</p>
    </header>

    <!-- 2. 상단 네비게이션 -->
    <nav id="main-nav">
        <ul>
            <li><a href="index.html">🏠 홈</a></li>
            <li><a href="book.html">📖 도서</a></li>
            <li><a href="movie.html">🎬 영화</a></li>
            <li class="select"><a href="write.html">✏️ 리뷰 작성</a></li>
        </ul>
    </nav>

    <!-- 3. 리뷰 작성 영역 -->
    <section id="content-section">

        <div class="section-top">
            <h2>✏️ 작품 등록 및 리뷰 작성</h2>
        </div>

        <div class="form-container">

            <form id="reviewForm">

                <!-- 작품 정보 -->
                <div class="form-section">
                    <h3>01. 작품 정보</h3>
                    <p class="section-description">
                        소개하고 싶은 도서 또는 영화의 정보를 입력해 주세요.
                    </p>

                    <label for="category">작품 종류</label>
                    <select id="category" required>
                        <option value="">작품 종류를 선택하세요</option>
                        <option value="book">도서</option>
                        <option value="movie">영화</option>
                    </select>

                    <label for="title">작품 제목</label>
                    <input type="text" id="title"
                        placeholder="작품 제목을 입력하세요" required>

                    <label for="author">저자 또는 감독</label>
                    <input type="text" id="author"
                        placeholder="저자 또는 감독을 입력하세요">

                    <label for="image">작품 이미지 주소</label>
                    <input type="url" id="image"
                        placeholder="이미지 URL을 입력하세요">

                    <label for="summary">작품 줄거리</label>
                    <textarea id="summary"
                        placeholder="작품의 줄거리를 소개해 주세요."
                        required></textarea>
                </div>

                <hr>

                <!-- 리뷰 정보 -->
                <div class="form-section">
                    <h3>02. 나의 감상평</h3>
                    <p class="section-description">
                        작품을 감상한 후 느낀 점을 자유롭게 작성해 주세요.
                    </p>

                    <label for="writer">작성자</label>
                    <input type="text" id="writer"
                        placeholder="닉네임을 입력하세요" required>

                    <label for="rating">별점</label>
                    <select id="rating" required>
                        <option value="">별점을 선택하세요</option>
                        <option value="5">★★★★★ (5점)</option>
                        <option value="4">★★★★☆ (4점)</option>
                        <option value="3">★★★☆☆ (3점)</option>
                        <option value="2">★★☆☆☆ (2점)</option>
                        <option value="1">★☆☆☆☆ (1점)</option>
                    </select>

                    <label for="content">리뷰 내용</label>
                    <textarea id="content"
                        placeholder="작품에 대한 솔직한 감상을 작성해 주세요."
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    작품 및 리뷰 등록하기
                </button>

                <p id="message"></p>

            </form>

        </div>

    </section>

    <!-- 4. 하단 -->
    <footer id="main-footer">
        <span>
            Culture Archive © 2026
            <br>
            Share your thoughts, remember your moments.
        </span>
    </footer>

    <script src="js/reviews.js"></script>

</body>
</html>
