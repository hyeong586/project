/*리뷰 작성 및 리뷰 목록*/

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review - Culture Archive</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">Culture Archive.</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="book.html">Books</a>
        <a href="movie.html">Movies</a>
        <a href="write.html">Write</a>
    </nav>
</header>

<main class="review-page">

    <section class="review-header">
        <p class="subtitle">YOUR CULTURE, YOUR STORY</p>
        <h1>작품과 감상을 기록하세요.</h1>
        <p>좋았던 책과 영화를 다른 사람들과 공유해 보세요.</p>
    </section>

    <section class="review-form">

        <h2>작품 등록 및 리뷰 작성</h2>

        <form id="reviewForm">

            <label for="category">작품 종류</label>
            <select id="category" required>
                <option value="">선택하세요</option>
                <option value="book">도서</option>
                <option value="movie">영화</option>
            </select>

            <label for="title">작품 제목</label>
            <input type="text" id="title"
                   placeholder="작품 제목을 입력하세요" required>

            <label for="author">저자 또는 감독</label>
            <input type="text" id="author"
                   placeholder="저자 또는 감독을 입력하세요">

            <label for="image">작품 이미지 주소</label>
            <input type="url" id="image"
                   placeholder="이미지 URL을 입력하세요">

            <label for="summary">작품 줄거리</label>
            <textarea id="summary"
                      placeholder="작품의 줄거리를 입력하세요"
                      required></textarea>

            <hr>

            <h3>나의 감상평</h3>

            <label for="writer">작성자</label>
            <input type="text" id="writer"
                   placeholder="닉네임을 입력하세요" required>

            <label for="rating">별점</label>
            <select id="rating" required>
                <option value="">별점을 선택하세요</option>
                <option value="5">★★★★★ (5점)</option>
                <option value="4">★★★★☆ (4점)</option>
                <option value="3">★★★☆☆ (3점)</option>
                <option value="2">★★☆☆☆ (2점)</option>
                <option value="1">★☆☆☆☆ (1점)</option>
            </select>

            <label for="content">리뷰 내용</label>
            <textarea id="content"
                      placeholder="작품을 감상한 후기를 작성하세요"
                      required></textarea>

            <button type="submit">작품 및 리뷰 등록하기</button>

        </form>

        <p id="message"></p>

    </section>

</main>

<footer>
    <p>Culture Archive © 2026</p>
</footer>

<script src="reviews.js"></script>

</body>
</html>
